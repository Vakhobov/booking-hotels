<!DOCTYPE html>
<html>
    <head>
        <title>Hotels in Tashkent</title>
        <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
        <style>
            #map { height: 600px; width: 100%; border-radius: 15px; }
            .hotel-popup { text-align: center; }
            .hotel-popup h3 { margin: 5px 0; color: #2c3e50; }
            .hotel-popup button { background: #3498db; color: white; border: none; padding: 5px 10px; border-radius: 5px; cursor: pointer; }
        </style>
    </head>
    <body>

        <h2 style="text-align: center;">Toshkent Mehmonxonalari Xaritasi</h2>
        <div id="map"></div>

        <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
        <script>
            // 1. Xaritani yaratish (Tashkent markazi)
            var map = L.map('map').setView([41.2995, 69.2401], 13);

            // OSM o'rniga CartoDB ishlatamiz (bu bloklamaydi)
            L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
                attribution: '© OpenStreetMap contributors © CARTO',
                subdomains: 'abcd',
                maxZoom: 20
            }).addTo(map);

            // Mehmonxona logosi (belgisi) uchun maxsus ikonka
            var hotelIcon = L.icon({
                iconUrl: 'https://cdn-icons-png.flaticon.com/512/235/235889.png', // Mehmonxona logosi
                iconSize: [35, 35],
                iconAnchor: [17, 35],
                popupAnchor: [0, -35]
            });

            // 2. Foydalanuvchi joylashuvini aniqlash
            map.locate({setView: true, maxZoom: 15});

            function onLocationFound(e) {
                L.marker(e.latlng).addTo(map).bindPopup("Siz shu yerdasiz").openPopup();
                loadHotels(); // Joylashuv aniqlangach, mehmonxonalarni yuklash
            }
            map.on('locationfound', onLocationFound);

            // 3. API dan ma'lumotlarni yuklash funksiyasi
            var markers = [];
            function loadHotels() {
                var bounds = map.getBounds();
                var url = `/api/hotels/?min_lat=${bounds.getSouth()}&max_lat=${bounds.getNorth()}&min_lon=${bounds.getWest()}&max_lon=${bounds.getEast()}`;

                fetch(url)
                    .then(res => res.json())
                    .then(data => {
                        // Eskirgan markerlarni o'chirish
                        markers.forEach(m => map.removeLayer(m));
                        markers = [];

                        data.results.forEach(hotel => {
                            var marker = L.marker([hotel.latitude, hotel.longitude], {icon: hotelIcon})
                                .addTo(map)
                                .bindPopup(`
                                    <div class="hotel-popup">
                                        <h3>${hotel.name}</h3>
                                        <p>⭐ Reyting: ${hotel.rating}</p>
                                        <p>📞 ${hotel.phone}</p>
                                        <button onclick="viewDetail(${hotel.id})">Batafsil ko'rish</button>
                                    </div>
                                `);
                            markers.push(marker);
                        });
                    });
            }

            // Xarita harakatlanganda mehmonxonalarni qayta yuklash
            map.on('moveend', loadHotels);

            function viewDetail(id) {
                alert("Mehmonxona ID: " + id + " bo'yicha batafsil ma'lumot sahifasiga o'tiladi.");
                // window.location.href = `/hotels/${id}/`;
            }
        </script>
    </body>
</html>
